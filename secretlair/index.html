<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deathrite Ramen’s Secret Lair Dashboard</title>
<style>
  :root {
    --bg: #14121a; --panel: #1e1b27; --line: #2e2a3b; --text: #ece9f3; --muted: #9a94ad; --accent: #e0a64a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: rgba(20,18,26,.95); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  h1 { font-size: 18px; margin: 0 12px 0 0; }
  nav button, .btn { background: var(--panel); color: var(--text); border: 1px solid var(--line); padding: 6px 14px; border-radius: 6px; cursor: pointer; font: inherit; }
  nav button.active { border-color: var(--accent); color: var(--accent); }
  input[type=search] { background: var(--panel); color: var(--text); border: 1px solid var(--line); padding: 6px 10px; border-radius: 6px; min-width: 200px; flex: 1; max-width: 320px; font: inherit; }
  #status { color: var(--muted); margin-left: auto; font-size: 13px; }
  main { padding: 16px; max-width: 1600px; margin: 0 auto; }
  .group { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 16px; padding: 12px 14px; scroll-margin-top: 80px; }
  .group h2 { margin: 0 0 10px; font-size: 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; }
  .group h2 .rank { color: var(--accent); }
  .group h2 .meta { color: var(--muted); font-size: 13px; font-weight: normal; }
  .grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .grid a { display: block; flex: 0 0 auto; }
  .grid img { display: block; border-radius: 6px; background: #2a2636; }
  .drop img { width: 146px; height: 204px; }
  .thumb img { width: 73px; height: 102px; }
  .thumb a:hover img, .drop a:hover img { outline: 2px solid var(--accent); }
  .cap { font-size: 11px; color: var(--muted); width: 146px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #error { color: #ff8a8a; padding: 16px; }
  #summary { margin-bottom: 16px; color: var(--muted); }
  .intro { color: var(--text); margin: 0 0 12px; max-width: 900px; line-height: 1.5; }
  .intro b { color: var(--accent); }
  #filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 16px; }
  #filters .sep { width: 1px; height: 18px; background: var(--line); margin: 0 6px; }
  .pill { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; font: inherit; font-size: 12px; line-height: 1.6; color: var(--text); cursor: pointer; white-space: nowrap; }
  .pill:hover { border-color: var(--accent); }
  .pill[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: rgba(224,166,74,.12); }
  footer { max-width: 1600px; margin: 0 auto; padding: 8px 16px 32px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }
  footer p { margin: 8px 0; max-width: 900px; }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  #more { text-align: center; padding: 16px; }
</style>
</head>
<body>
<header>
  <h1>Deathrite Ramen’s Secret Lair Dashboard</h1>
  <nav>
    <button id="tab-top" class="active">Most printed cards</button>
    <button id="tab-drops">Drops by date</button>
  </nav>
  <input id="q" type="search" placeholder="Filter by card name…">
  <button class="btn" id="refresh" title="Reload the latest data">Refresh data</button>
  <span id="status"></span>
</header>
<main>
  <div id="summary"></div>
  <div id="filters"></div>
  <div id="error" hidden></div>
  <div id="view"></div>
  <div id="more" hidden><button class="btn" id="more-btn">Show more</button></div>
</main>
<footer>
  <p>Card data and images courtesy of <a href="https://scryfall.com" target="_blank" rel="noopener">Scryfall</a>. This is an unofficial fan project and is not produced by, affiliated with, or endorsed by Scryfall or Wizards of the Coast. Magic: The Gathering is © Wizards of the Coast.<span id="data-updated"></span></p>
  <p>Find me on
    <a href="https://instagram.com/deathritera.men" target="_blank" rel="noopener">Instagram</a> ·
    <a href="https://twitter.com/deathriteramen" target="_blank" rel="noopener">Twitter</a> ·
    <a href="https://moxfield.com/users/deathriteramen" target="_blank" rel="noopener">Moxfield</a></p>
</footer>

<script>
const DATA_URL = 'data.json'; // built daily from Scryfall bulk data by scripts/build-data.py
const PAGE_SIZE = 25;
const REFRESH_COOLDOWN_MS = 60 * 1000;

const $ = id => document.getElementById(id);
let cards = [], tab = 'top', shown = PAGE_SIZE, filter = '';
let groups = [], rendered = 0, introHtml = '';
let excludeBasics = false;
const activeTypes = new Set();

// Card-type filters, matched against Scryfall's type_line. Tokens only match the Tokens pill.
const isToken = c => /\bToken\b/.test(c.t);
const isBasic = c => /\bBasic\b/.test(c.t);
const typeTest = word => c => !isToken(c) && new RegExp('\\b' + word + '\\b').test(c.t);
const TYPE_FILTERS = [
  ['Creatures', typeTest('Creature')],
  ['Artifacts', typeTest('Artifact')],
  ['Enchantments', typeTest('Enchantment')],
  ['Planeswalkers', typeTest('Planeswalker')],
  ['Instants', typeTest('Instant')],
  ['Sorceries', typeTest('Sorcery')],
  ['Basic Lands', c => !isToken(c) && isBasic(c) && /\bLand\b/.test(c.t)],
  ['Lands', typeTest('Land')],
  ['Tokens', isToken],
];

// Cards that pass the basics toggle and the type pills (any selected type matches).
function visibleCards() {
  const tests = TYPE_FILTERS.filter(([name]) => activeTypes.has(name)).map(([, fn]) => fn);
  return cards.filter(c => !(excludeBasics && isBasic(c)) && (!tests.length || tests.some(fn => fn(c))));
}

async function load(force) {
  $('error').hidden = true;
  try {
    // 'no-cache' = revalidate with the server (cheap 304 if unchanged), so we always see the latest daily build.
    const res = await fetch(DATA_URL, { cache: force ? 'reload' : 'no-cache' });
    if (!res.ok) throw new Error('data.json returned ' + res.status);
    const j = await res.json();
    cards = j.cards;
    $('data-updated').textContent = j.source_updated_at
      ? ` Data last updated ${new Date(j.source_updated_at).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })}.` : '';
  } catch (e) {
    $('error').textContent = 'Failed to load card data: ' + e.message + ' (open the site through a web server, not file://)';
    $('error').hidden = false;
    return;
  }
  renderFilters(); syncFilters();
  render();
}

const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function fmtDate(d) {
  return new Date(d + 'T00:00:00').toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
}

function dropsView() {
  const f = filter.toLowerCase();
  const byDate = new Map();
  for (const c of visibleCards()) {
    if (f && !c.n.toLowerCase().includes(f)) continue;
    if (!byDate.has(c.d)) byDate.set(c.d, []);
    byDate.get(c.d).push(c);
  }
  return [...byDate.entries()].sort((a, b) => b[0].localeCompare(a[0])).map(([date, list]) => {
    list.sort((a, b) => a.cn.localeCompare(b.cn, undefined, { numeric: true }));
    return { date, list };
  });
}

function groupByName(list) {
  const byName = new Map(), prints = new Map();
  for (const c of list) {
    prints.set(c.n, (prints.get(c.n) || 0) + 1);
    if (!byName.has(c.n)) byName.set(c.n, new Map());
    const arts = byName.get(c.n);
    const prev = arts.get(c.i);
    if (!prev || c.d > prev.d) arts.set(c.i, c); // one thumbnail per unique illustration
  }
  return [...byName.entries()]
    .map(([name, arts]) => ({ name, prints: prints.get(name), arts: [...arts.values()].sort((a, b) => b.d.localeCompare(a.d)) }));
}

function topView() {
  const f = filter.toLowerCase();
  return groupByName(visibleCards())
    .filter(g => !f || g.name.toLowerCase().includes(f))
    .sort((a, b) => b.arts.length - a.arts.length || a.name.localeCompare(b.name));
}

function dropHtml(g) {
  return `
    <section class="group drop">
      <h2>${fmtDate(g.date)} <span class="meta">${g.list.length} card${g.list.length === 1 ? '' : 's'}</span></h2>
      <div class="grid">${g.list.map(c => `
        <div><a href="${c.u}" target="_blank" rel="noopener"><img loading="lazy" src="${c.m || c.s}" alt="${esc(c.n)}"></a>
        <div class="cap" title="${esc(c.n)}">${esc(c.n)}</div></div>`).join('')}
      </div>
    </section>`;
}

function topHtml(g, i) {
  const n = g.arts.length;
  return `
    <section class="group thumb" data-count="${n}">
      <h2>${filter ? '' : `<span class="rank">#${i + 1}</span> `}${esc(g.name)} <span class="meta">${n === 1 ? '1 art' : n + ' different arts'}</span></h2>
      <div class="grid">${g.arts.map(c => `
        <a href="${c.u}" target="_blank" rel="noopener" title="${esc(c.n)} — ${fmtDate(c.d)}"><img loading="lazy" src="${c.s}" alt="${esc(c.n)}"></a>`).join('')}
      </div>
    </section>`;
}

// Append groups [rendered, upto) without touching existing DOM (keeps loaded images).
function extend(upto) {
  upto = Math.min(upto, groups.length);
  const fn = tab === 'drops' ? dropHtml : topHtml;
  $('view').insertAdjacentHTML('beforeend', groups.slice(rendered, upto).map((g, k) => fn(g, rendered + k)).join(''));
  rendered = upto;
  shown = upto;
  $('more').hidden = rendered >= groups.length;
}

// Intro stats are always global (all cards, no filters).
function buildIntro() {
  const distinct = new Set(cards.map(c => c.n + '|' + c.i)).size;
  const first = `There have been ${cards.length} total Secret Lair cards (so far) with ${distinct} distinct pieces of art on them.`;
  const all = groupByName(cards);
  // Buckets: 4+ arts together, then 3, 2, 1 (biggest count first); weighted by card printings.
  const buckets = [
    { n: 4, test: n => n >= 4 }, { n: 3, test: n => n === 3 }, { n: 2, test: n => n === 2 }, { n: 1, test: n => n === 1 },
  ].map(b => ({ ...b, prints: all.filter(g => b.test(g.arts.length)).reduce((a, g) => a + g.prints, 0) }))
    .filter(b => b.prints);
  // Whole-number percents; largest-remainder so they sum to exactly 100%.
  const base = buckets.reduce((a, b) => a + b.prints, 0);
  const pct = buckets.map(b => Math.floor(b.prints * 100 / base));
  const left = 100 - pct.reduce((a, b) => a + b, 0);
  buckets.map((b, i) => [i, (b.prints * 100 / base) % 1]).sort((a, b) => b[1] - a[1])
    .slice(0, left).forEach(([i]) => pct[i]++);
  const words = { 1: 'one', 2: 'two', 3: 'three' };
  const last = buckets.length - 1;
  const sentence = buckets.map((b, i) => {
    const p = `<b>${pct[i]}%</b>`;
    if (i === 0) return `${p} of card choices have ${b.n === 4 ? 'four or more' : words[b.n]} distinct art treatment${b.n === 1 ? '' : 's'}`;
    return `${i === last ? 'and ' : ''}${p} ${b.n === 1 ? 'only have one' : 'have ' + words[b.n]}`;
  }).join(', ');
  return { first, full: `${first} ${sentence}.` };
}

function renderSummary() {
  const intro = buildIntro();
  $('summary').innerHTML = `<p class="intro">${tab === 'top' ? intro.full : intro.first}</p>`;
}

function renderFilters() {
  const pill = (label, key) => `<button class="pill" data-filter="${key}" aria-pressed="false">${label}</button>`;
  $('filters').innerHTML = pill('Exclude Basic Lands', '__basics') + '<span class="sep"></span>'
    + TYPE_FILTERS.map(([name]) => pill(name, name)).join('');
}
function syncFilters() {
  $('filters').querySelectorAll('.pill').forEach(b => {
    const k = b.dataset.filter;
    b.setAttribute('aria-pressed', String(k === '__basics' ? excludeBasics : activeTypes.has(k)));
  });
}
$('filters').onclick = e => {
  const b = e.target.closest('.pill'); if (!b) return;
  const k = b.dataset.filter;
  if (k === '__basics') excludeBasics = !excludeBasics;
  else activeTypes.has(k) ? activeTypes.delete(k) : activeTypes.add(k);
  syncFilters(); shown = PAGE_SIZE; render();
};

function render() {
  groups = tab === 'drops' ? dropsView() : topView();
  $('view').innerHTML = '';
  rendered = 0;
  extend(shown);
  if (!groups.length) $('view').innerHTML = '<p style="color:var(--muted)">No results.</p>';
  renderSummary();
}

function setTab(t) {
  tab = t; shown = PAGE_SIZE;
  $('tab-drops').classList.toggle('active', t === 'drops');
  $('tab-top').classList.toggle('active', t === 'top');
  render();
}
$('tab-drops').onclick = () => setTab('drops');
$('tab-top').onclick = () => setTab('top');
$('more-btn').onclick = () => extend(rendered + PAGE_SIZE);
let cooldownUntil = 0;
$('refresh').onclick = () => {
  const wait = cooldownUntil - Date.now();
  if (wait > 0) { $('status').textContent = `Please wait ${Math.ceil(wait / 1000)}s before refreshing again`; setTimeout(() => { $('status').textContent = ''; }, 3000); return; }
  cooldownUntil = Date.now() + REFRESH_COOLDOWN_MS;
  shown = PAGE_SIZE; load(true);
};
let t;
$('q').oninput = e => { clearTimeout(t); t = setTimeout(() => { filter = e.target.value.trim(); shown = PAGE_SIZE; render(); }, 200); };

load();
</script>
</body>
</html>
