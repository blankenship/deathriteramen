<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deathrite Ramen’s Secret Lair Dashboard</title>
<style>
  :root {
    --bg: #14121a; --panel: #1e1b27; --line: #2e2a3b; --text: #ece9f3; --muted: #9a94ad; --accent: #e0a64a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: rgba(20,18,26,.95); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  h1 { font-size: 18px; margin: 0 12px 0 0; }
  nav button, .btn { background: var(--panel); color: var(--text); border: 1px solid var(--line); padding: 6px 14px; border-radius: 6px; cursor: pointer; font: inherit; }
  nav button.active { border-color: var(--accent); color: var(--accent); }
  input[type=search] { background: var(--panel); color: var(--text); border: 1px solid var(--line); padding: 6px 10px; border-radius: 6px; min-width: 200px; flex: 1; max-width: 320px; font: inherit; }
  #status { color: var(--muted); margin-left: auto; font-size: 13px; }
  main { padding: 16px; max-width: 1600px; margin: 0 auto; }
  .group { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 16px; padding: 12px 14px; scroll-margin-top: 80px; }
  .group h2 { margin: 0 0 10px; font-size: 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; }
  .group h2 .rank { color: var(--accent); }
  .group h2 .meta { color: var(--muted); font-size: 13px; font-weight: normal; }
  .grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .grid a { display: block; flex: 0 0 auto; }
  .grid img { display: block; border-radius: 6px; background: #2a2636; }
  .drop img { width: 146px; height: 204px; }
  .thumb img { width: 73px; height: 102px; }
  .thumb a:hover img, .drop a:hover img { outline: 2px solid var(--accent); }
  .cap { font-size: 11px; color: var(--muted); width: 146px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #error { color: #ff8a8a; padding: 16px; }
  #summary { margin-bottom: 16px; color: var(--muted); }
  #summary .total { display: block; margin-bottom: 8px; color: var(--text); font-weight: 600; }
  #summary .sub { color: var(--muted); font-weight: normal; }
  .intro { color: var(--text); margin: 0 0 12px; max-width: 900px; line-height: 1.5; }
  .intro b { color: var(--accent); }
  #details-toggle { color: var(--accent); cursor: pointer; font-size: 13px; }
  #details-toggle:hover { text-decoration: underline; }
  .pills[hidden] { display: none; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .pill { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; font-size: 12px; line-height: 1.6; color: var(--text); cursor: pointer; white-space: nowrap; }
  .pill:hover { border-color: var(--accent); }
  #more { text-align: center; padding: 16px; }
</style>
</head>
<body>
<header>
  <h1>Deathrite Ramen’s Secret Lair Dashboard</h1>
  <nav>
    <button id="tab-top" class="active">Most printed cards</button>
    <button id="tab-drops">Drops by date</button>
  </nav>
  <input id="q" type="search" placeholder="Filter by card name…">
  <button class="btn" id="refresh" title="Discard cache and re-fetch from Scryfall">Refresh data</button>
  <span id="status"></span>
</header>
<main>
  <div id="summary"></div>
  <div id="error" hidden></div>
  <div id="view"></div>
  <div id="more" hidden><button class="btn" id="more-btn">Show more</button></div>
</main>

<script>
const API = 'https://api.scryfall.com/cards/search?q=set%3Asld&unique=prints&order=set&dir=asc';
const CACHE_KEY = 'sld-cache-v2';
const CACHE_TTL = 24 * 3600 * 1000;
const PAGE_SIZE = 25;

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
let cards = [], tab = 'top', shown = PAGE_SIZE, filter = '';
let groups = [], rendered = 0, detailsOpen = false;

function slim(c) {
  const face = c.card_faces && !c.image_uris ? c.card_faces[0] : c;
  const img = face.image_uris || {};
  return {
    id: c.id, n: c.name, d: c.released_at, cn: c.collector_number, u: c.scryfall_uri.replace('?utm_source=api', ''),
    i: face.illustration_id || c.illustration_id || c.id,
    s: img.small, m: img.normal,
  };
}

function loadCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY));
    if (c && Date.now() - c.t < CACHE_TTL) return c.cards;
  } catch (e) {}
  return null;
}
function saveCache(list) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), cards: list })); } catch (e) {}
}

async function fetchAll() {
  const out = [], seen = new Set();
  let url = API;
  while (url) {
    const res = await fetch(url, { headers: { Accept: 'application/json' } });
    if (!res.ok) throw new Error('Scryfall returned ' + res.status);
    const j = await res.json();
    j.data.forEach(c => { if (!seen.has(c.id)) { seen.add(c.id); out.push(slim(c)); } });
    $('status').textContent = `Loading… ${out.length} / ${j.total_cards}`;
    url = j.has_more ? j.next_page : null;
    if (url) await sleep(100); // Scryfall rate-limit courtesy
  }
  return out;
}

async function load(force) {
  $('error').hidden = true;
  let list = force ? null : loadCache();
  if (!list) {
    $('view').innerHTML = '';
    try { list = await fetchAll(); saveCache(list); }
    catch (e) { $('error').textContent = 'Failed to load from Scryfall: ' + e.message; $('error').hidden = false; return; }
  }
  cards = list;
  $('status').textContent = '';
  render();
}

const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function fmtDate(d) {
  return new Date(d + 'T00:00:00').toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
}

function dropsView() {
  const f = filter.toLowerCase();
  const byDate = new Map();
  for (const c of cards) {
    if (f && !c.n.toLowerCase().includes(f)) continue;
    if (!byDate.has(c.d)) byDate.set(c.d, []);
    byDate.get(c.d).push(c);
  }
  return [...byDate.entries()].sort((a, b) => b[0].localeCompare(a[0])).map(([date, list]) => {
    list.sort((a, b) => a.cn.localeCompare(b.cn, undefined, { numeric: true }));
    return { date, list };
  });
}

function topView() {
  const f = filter.toLowerCase();
  const byName = new Map(), prints = new Map();
  for (const c of cards) {
    prints.set(c.n, (prints.get(c.n) || 0) + 1);
    if (!byName.has(c.n)) byName.set(c.n, new Map());
    const arts = byName.get(c.n);
    const prev = arts.get(c.i);
    if (!prev || c.d > prev.d) arts.set(c.i, c); // one thumbnail per unique illustration
  }
  return [...byName.entries()]
    .map(([name, arts]) => ({ name, prints: prints.get(name), arts: [...arts.values()].sort((a, b) => b.d.localeCompare(a.d)) }))
    .filter(g => !f || g.name.toLowerCase().includes(f))
    .sort((a, b) => b.arts.length - a.arts.length || a.name.localeCompare(b.name));
}

function dropHtml(g) {
  return `
    <section class="group drop">
      <h2>${fmtDate(g.date)} <span class="meta">${g.list.length} card${g.list.length === 1 ? '' : 's'}</span></h2>
      <div class="grid">${g.list.map(c => `
        <div><a href="${c.u}" target="_blank" rel="noopener"><img loading="lazy" src="${c.m || c.s}" alt="${esc(c.n)}"></a>
        <div class="cap" title="${esc(c.n)}">${esc(c.n)}</div></div>`).join('')}
      </div>
    </section>`;
}

function topHtml(g, i) {
  const n = g.arts.length;
  return `
    <section class="group thumb" data-count="${n}">
      <h2>${filter ? '' : `<span class="rank">#${i + 1}</span> `}${esc(g.name)} <span class="meta">${n === 1 ? '1 art' : n + ' different arts'}</span></h2>
      <div class="grid">${g.arts.map(c => `
        <a href="${c.u}" target="_blank" rel="noopener" title="${esc(c.n)} — ${fmtDate(c.d)}"><img loading="lazy" src="${c.s}" alt="${esc(c.n)}"></a>`).join('')}
      </div>
    </section>`;
}

// Append groups [rendered, upto) without touching existing DOM (keeps loaded images).
function extend(upto) {
  upto = Math.min(upto, groups.length);
  const fn = tab === 'drops' ? dropHtml : topHtml;
  $('view').insertAdjacentHTML('beforeend', groups.slice(rendered, upto).map((g, k) => fn(g, rendered + k)).join(''));
  rendered = upto;
  shown = upto;
  $('more').hidden = rendered >= groups.length;
}

function renderSummary() {
  const distinct = new Set(cards.map(c => c.n + '|' + c.i)).size;
  if (tab !== 'top') { $('summary').innerHTML = `<p class="intro">There have been ${cards.length} total Secret Lair cards (so far) with ${distinct} distinct pieces of art on them.</p>`; return; }
  const counts = new Map();
  groups.forEach(g => counts.set(g.arts.length, (counts.get(g.arts.length) || 0) + 1));
  const rows = [...counts.entries()].sort((a, b) => b[0] - a[0]);
  // Buckets: 4+ arts together, then 3, 2, 1 (biggest count first).
  const buckets = [
    { label: 'Cards with 4 or more arts', rows: rows.filter(([n]) => n >= 4) },
    ...[3, 2, 1].map(n => ({ label: `Cards with ${n} art${n === 1 ? '' : 's'}`, rows: rows.filter(([m]) => m === n) })),
  ].filter(b => b.rows.length);
  buckets.forEach(b => {
    b.cards = b.rows.reduce((a, [, k]) => a + k, 0);
    const ns = new Set(b.rows.map(([n]) => n));
    b.prints = groups.filter(g => ns.has(g.arts.length)).reduce((a, g) => a + g.prints, 0);
  });
  // Whole-number percents; largest-remainder so each column sums to exactly 100%.
  const share = key => {
    const base = buckets.reduce((a, b) => a + b[key], 0);
    const out = buckets.map(b => Math.floor(b[key] * 100 / base));
    let left = base ? 100 - out.reduce((a, b) => a + b, 0) : 0;
    buckets.map((b, i) => [i, (b[key] * 100 / base) % 1]).sort((a, b) => b[1] - a[1])
      .slice(0, left).forEach(([i]) => out[i]++);
    return out;
  };
  const pct = share('prints');
  const words = { 1: 'one', 2: 'two', 3: 'three' };
  const last = buckets.length - 1;
  const phrase = (b, i) => {
    const p = `<b>${pct[i]}%</b>`;
    const is4 = b.label.includes('4 or more'), n = b.rows[0][0];
    if (i === 0) return `${p} of card choices have ${is4 ? 'four or more' : words[n]} distinct art treatment${!is4 && n === 1 ? '' : 's'}`;
    return `${i === last ? 'and ' : ''}${p} ${n === 1 ? 'only have one' : 'have ' + words[n]}`;
  };
  const sentence = buckets.map(phrase).join(', ');
  const pills = rows.map(([n, k]) => `<a class="pill" data-count="${n}">${n} art${n === 1 ? '' : 's'} (${k} card${k === 1 ? '' : 's'})</a>`).join('');
  $('summary').innerHTML = `<p class="intro">There have been ${cards.length} total Secret Lair cards (so far) with ${distinct} distinct pieces of art on them. ${sentence}.</p>`
    + `<a id="details-toggle" href="#">${detailsOpen ? 'Hide the breakdown' : 'See the breakdown'}</a>`
    + `<div class="pills" ${detailsOpen ? '' : 'hidden'}>${pills}</div>`;
}

function jumpTo(n) {
  const idx = groups.findIndex(g => g.arts.length === n);
  if (idx < 0) return;
  if (idx >= rendered) extend(idx + PAGE_SIZE);
  $('view').querySelector(`.group[data-count="${n}"]`).scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function render() {
  groups = tab === 'drops' ? dropsView() : topView();
  $('view').innerHTML = '';
  rendered = 0;
  extend(shown);
  if (!groups.length) $('view').innerHTML = '<p style="color:var(--muted)">No results.</p>';
  renderSummary();
}

function setTab(t) {
  tab = t; shown = PAGE_SIZE;
  $('tab-drops').classList.toggle('active', t === 'drops');
  $('tab-top').classList.toggle('active', t === 'top');
  render();
}
$('summary').onclick = e => {
  if (e.target.id === 'details-toggle') { e.preventDefault(); detailsOpen = !detailsOpen; renderSummary(); return; } const a = e.target.closest('a[data-count]'); if (a) jumpTo(+a.dataset.count); };
$('tab-drops').onclick = () => setTab('drops');
$('tab-top').onclick = () => setTab('top');
$('more-btn').onclick = () => extend(rendered + PAGE_SIZE);
$('refresh').onclick = () => { shown = PAGE_SIZE; load(true); };
let t;
$('q').oninput = e => { clearTimeout(t); t = setTimeout(() => { filter = e.target.value.trim(); shown = PAGE_SIZE; render(); }, 200); };

load();
</script>
</body>
</html>
