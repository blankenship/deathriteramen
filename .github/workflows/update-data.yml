# NOTE: this file must live at the REPO ROOT: .github/workflows/update-data.yml
# (GitHub ignores workflows inside subfolders). The site itself lives in /secretlair.
name: Update Secret Lair data

on:
  schedule:
    - cron: "17 12 * * *"   # daily, 12:17 UTC (Scryfall regenerates its bulk files ~09:00 UTC)
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Rebuild data.json from Scryfall bulk data
        run: python3 secretlair/scripts/build-data.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- secretlair/data.json; then
            echo "No changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add secretlair/data.json
            git commit -m "Update Secret Lair data"
            git push
          fi
